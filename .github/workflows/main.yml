name: LEON AI Project Build

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build-leon:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Build Leon
    run: node tools/build.js --no-android

  - name: Upload Leon Build
    uses: actions/upload-artifact@v4
    with:
      name: LEON-AI-Build
      path: dist/
      if-no-files-found: error